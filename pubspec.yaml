name: caba_dz
description: "CabaDZ - Connect. Travel. Deliver. من الجزائر إلى العالم"
publish_to: 'none'

version: 1.0.5+5

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  google_fonts: ^6.2.1
  go_router: ^14.2.0
  provider: ^6.1.2
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  intl_phone_field: ^3.2.0
  image_picker: ^1.1.2
  dio: ^5.8.0+1
  crypto: ^3.0.6
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.3
  pdf: ^3.11.3
  printing: ^5.14.2
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/caba_logo.png
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/caba_logo.png
  adaptive_icon_foreground_inset: 16

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/video/
